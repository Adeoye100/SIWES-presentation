<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <rect width="1280" height="720" fill="#050505"/>
  <rect x="1" y="1" width="1278" height="718" fill="none" stroke="#333333" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="24" y="24" width="1232" height="56" fill="#0c0c0c" stroke="#222222" stroke-width="1"/>
  <text x="48" y="58" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="2">NEXOS DATA ARCHITECTURE — SQLITE OFFLINE WRITE QUEUE &amp; TRANSACTION SYNC</text>

  <!-- Left Box: Desktop Client Event -->
  <rect x="80" y="140" width="300" height="420" fill="#0a0a0a" stroke="#ffffff" stroke-width="1"/>
  <text x="100" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">DESKTOP CLIENT UI</text>
  <text x="100" y="210" font-family="sans-serif" font-size="11" fill="#888888">Qt Event Trigger</text>
  
  <rect x="100" y="240" width="260" height="60" fill="#141414" stroke="#333333" stroke-width="1"/>
  <text x="115" y="275" font-family="monospace" font-size="11" fill="#ffffff">1. Local Action Created</text>
  
  <rect x="100" y="320" width="260" height="60" fill="#141414" stroke="#333333" stroke-width="1"/>
  <text x="115" y="355" font-family="monospace" font-size="11" fill="#ffffff">2. Write to SQLite Queue</text>

  <rect x="100" y="400" width="260" height="120" fill="#0f0f0f" stroke="#333333" stroke-width="1"/>
  <text x="115" y="430" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00ffcc">OFFLINE FIRST GUARANTEE</text>
  <text x="115" y="460" font-family="sans-serif" font-size="10" fill="#888888">Zero network dependency for</text>
  <text x="115" y="480" font-family="sans-serif" font-size="10" fill="#888888">immediate user responsiveness.</text>

  <!-- Arrow Left to Middle -->
  <line x1="380" y1="350" x2="480" y2="350" stroke="#ffffff" stroke-width="2"/>
  <polygon points="480,350 470,344 470,356" fill="#ffffff"/>

  <!-- Middle Box: Embedded SQLite Database Engine -->
  <rect x="480" y="140" width="320" height="420" fill="#0a0a0a" stroke="#ffffff" stroke-width="2"/>
  <text x="500" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SQLITE EMBEDDED ENGINE</text>
  <text x="500" y="210" font-family="sans-serif" font-size="11" fill="#888888">WAL Mode (Write-Ahead Logging)</text>

  <rect x="500" y="240" width="280" height="70" fill="#111111" stroke="#333333" stroke-width="1"/>
  <text x="515" y="270" font-family="monospace" font-size="12" fill="#ffffff">TABLE: pending_sync</text>
  <text x="515" y="292" font-family="sans-serif" font-size="10" fill="#00ffcc">Indexed by Tx Timestamp</text>

  <rect x="500" y="330" width="280" height="70" fill="#111111" stroke="#333333" stroke-width="1"/>
  <text x="515" y="360" font-family="monospace" font-size="12" fill="#ffffff">TABLE: asset_metadata</text>
  <text x="515" y="382" font-family="sans-serif" font-size="10" fill="#888888">Relational Foreign Keys</text>

  <rect x="500" y="420" width="280" height="120" fill="#111111" stroke="#333333" stroke-width="1"/>
  <text x="515" y="450" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">ATOMIC TRANSACTIONS</text>
  <text x="515" y="475" font-family="sans-serif" font-size="10" fill="#888888">BEGIN TRANSACTION;</text>
  <text x="515" y="495" font-family="sans-serif" font-size="10" fill="#888888">COMMIT ON SUCCESS;</text>
  <text x="515" y="515" font-family="sans-serif" font-size="10" fill="#00ffcc">Zero Corruption Guarantee</text>

  <!-- Arrow Middle to Right -->
  <line x1="800" y1="350" x2="900" y2="350" stroke="#ffffff" stroke-width="2"/>
  <polygon points="900,350 890,344 890,356" fill="#ffffff"/>

  <!-- Right Box: Background Reconnect Sync Manager -->
  <rect x="900" y="140" width="300" height="420" fill="#0a0a0a" stroke="#00ffcc" stroke-width="2"/>
  <text x="920" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">RECONNECT SYNC MANAGER</text>
  <text x="920" y="210" font-family="sans-serif" font-size="11" fill="#00ffcc">Automated Background Worker</text>

  <rect x="920" y="240" width="260" height="80" fill="#111111" stroke="#222222" stroke-width="1"/>
  <text x="935" y="270" font-family="sans-serif" font-size="11" fill="#ffffff">Conflict Resolution Protocol</text>
  <text x="935" y="295" font-family="sans-serif" font-size="10" fill="#888888">Deterministic Timestamp Rule</text>

  <rect x="920" y="340" width="260" height="80" fill="#111111" stroke="#222222" stroke-width="1"/>
  <text x="935" y="370" font-family="sans-serif" font-size="11" fill="#ffffff">Batch Payload Construction</text>
  <text x="935" y="395" font-family="sans-serif" font-size="10" fill="#888888">Compressed JSON Packets</text>

  <rect x="920" y="440" width="260" height="100" fill="#111111" stroke="#00ffcc" stroke-width="1"/>
  <text x="935" y="470" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">CLOUD SYNCHRONIZATION</text>
  <text x="935" y="495" font-family="sans-serif" font-size="10" fill="#00ffcc">RESTful API Endpoint Sync</text>
  <text x="935" y="515" font-family="sans-serif" font-size="10" fill="#888888">Purge Synced Queue Items</text>
</svg>
