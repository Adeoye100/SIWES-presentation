name: Fix Section 06 overlay containment

on:
  push:
    branches:
      - fix/section-06-gallery

permissions:
  contents: write

jobs:
  patch-overlay:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/section-06-gallery
          fetch-depth: 0
      - name: Make popup positioning self-contained
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          needle = ".project-gallery-modal-overlay {\n  opacity: 0;"
          replacement = ".project-gallery-modal-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 99999999;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 0;\n  overflow: hidden;\n  opacity: 0;"
          if text.count(needle) != 1:
              raise SystemExit('Expected one Section 06 overlay rule')
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check -- index.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: make section 06 popup viewport-safe"
          git push origin HEAD:fix/section-06-gallery
