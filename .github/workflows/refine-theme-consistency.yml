name: Refine theme consistency

on:
  push:
    branches:
      - feat/theme-toggle
    paths:
      - .github/scripts/refine-theme-consistency.py
      - .github/workflows/refine-theme-consistency.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/theme-toggle
          fetch-depth: 0

      - name: Apply consistency refinements
        run: python3 .github/scripts/refine-theme-consistency.py

      - name: Verify global theme and offline runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'id="theme-toggle"',
              ':root[data-theme="light"]',
              '--card-bg: var(--surface-elevated);',
              '.workflow-desc { font-size: 16px; color: var(--text-muted);',
              '.kanban-card { background: var(--active-bg);',
              ':root[data-theme="light"] .project-media-overlay {',
              '<script src="gsap.min.js"></script>',
              '<script src="ScrollTrigger.min.js"></script>',
              "localStorage.setItem(THEME_STORAGE_KEY",
          ]
          for item in required:
              assert item in text, item
          for item in ['fonts.googleapis.com', 'fonts.gstatic.com', 'cdnjs.cloudflare.com']:
              assert item not in text, item
          assert text.count('id="theme-toggle"') == 1
          assert text.count('id="theme-toggle-label"') == 1
          print('Theme consistency/offline checks passed')
          PY
          git diff --check

      - name: Commit production change and remove helpers
        run: |
          rm -f .github/scripts/refine-theme-consistency.py .github/workflows/refine-theme-consistency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep projection theme consistent across sections"
          git push origin HEAD:feat/theme-toggle
