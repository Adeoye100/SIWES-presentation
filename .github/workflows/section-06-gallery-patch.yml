name: Apply Section 06 gallery refinement

on:
  push:
    branches:
      - fix/section-06-gallery

permissions:
  contents: write

jobs:
  patch-section-06:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/section-06-gallery
          fetch-depth: 0

      - name: Refine Section 06 project gallery
        run: python .github/scripts/patch_section06.py

      - name: Verify changed file
        run: |
          git diff --check -- index.html
          git diff --exit-code --quiet -- index.html && exit 1 || true

      - name: Preserve patched file
        uses: actions/upload-artifact@v4
        with:
          name: section-06-patched-index
          path: index.html
          if-no-files-found: error

      - name: Commit and push change
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: simplify section 06 project galleries"
          git push origin HEAD:fix/section-06-gallery
